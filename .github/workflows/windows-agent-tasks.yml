name: Windows agent tasks

# Задачи выполняются на self-hosted раннере пользователя. Причина: у агента нет
# доступа к внешней сети (кроме github.com/api.github.com/codeload), а логи и
# артефакты Actions из его песочницы скачать нельзя. Поэтому единственный
# читаемый им канал - git, и результат публикуется коммитом в ветку ci-reports,
# а не в лог.
#
# ВАЖНО (проверено на практике, прогон #1 от 2026-10-08):
#   в блоках run: допустимы ТОЛЬКО символы ASCII.
#   Windows PowerShell 5.1 читает сгенерированный .ps1 как системную ANSI-кодировку
#   (CP1251 на русской Windows), а не как UTF-8. Кириллица при этом превращается
#   в мусор, а буквы Д/В/Г/Б/ё дают символы U+201C/U+201D/U+2018/U+2019, которые
#   PowerShell считает ограничителями строк - скрипт падает с ошибкой разбора
#   ещё до запуска ("The string is missing the terminator").
#   Поэтому: сообщения в run-блоках - по-английски, кириллица живёт в питоновских
#   файлах (Python читает исходники как UTF-8) и в комментариях YAML (они в
#   .ps1 не попадают). Тест tests/test_ci_workflows.py это правило проверяет.
#
# Остальные особенности схемы (сознательные):
#   * workflow должен существовать в ветке main - таково требование
#     workflow_dispatch, поэтому перед первым запуском PR нужно смёржить;
#   * НЕТ входных параметров: тело задачи берётся из кода репозитория, а не из
#     строки, введённой человеком (это исключает инъекцию через inputs);
#   * НЕТ secrets: используется только автоматический github.token;
#   * НЕТ сторонних actions: код забирается обычным git. Так задача не зависит
#     от версии раннера и Node, которые на машине могут быть любыми;
#   * причины сбоя дублируются в аннотации через ##[error]: лог прогона агент
#     прочитать не может, а аннотации читает через API.

on:
  workflow_dispatch:

permissions:
  contents: write   # нужно ровно для одного: закоммитить отчёт в ветку ci-reports

concurrency:
  group: agent-tasks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  net-probe:
    name: net_probe
    runs-on: [self-hosted, Windows, X64, deovr-bridge]
    timeout-minutes: 15
    env:
      # Автоматический токен прогона. GitHub маскирует его в логах; используется
      # только для доступа к этому же репозиторию.
      GH_TOKEN: ${{ github.token }}
      GIT_TERMINAL_PROMPT: "0"   # не ждать ввода пароля, а сразу падать
      PYTHONIOENCODING: utf-8    # чтобы русский вывод python не ронял процесс

    steps:
      - name: Diagnostics
        shell: powershell
        # Ничего не проверяем и не падаем: цель - показать в логе, что за
        # окружение, чтобы первая же неудача была диагностируемой.
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "Runner OS:          $env:RUNNER_OS $env:RUNNER_ARCH"
          Write-Host "Runner name:        $env:RUNNER_NAME"
          Write-Host "Runner environment: $env:RUNNER_ENVIRONMENT"
          Write-Host "Workspace:          $env:RUNNER_WORKSPACE"
          Write-Host "Temp:               $env:RUNNER_TEMP"
          Write-Host "PowerShell:         $($PSVersionTable.PSVersion)"

          try { Write-Host "git:                $(& git --version)" }
          catch { Write-Host "git:                NOT FOUND" }

          $py = $null
          $pyArgs = @()
          if (Get-Command python -ErrorAction SilentlyContinue) { $py = "python" }
          elseif (Get-Command py -ErrorAction SilentlyContinue) { $py = "py"; $pyArgs = @("-3") }
          elseif ($env:DEOVR_CI_PYTHON) { $py = $env:DEOVR_CI_PYTHON }

          if ($py) {
            Write-Host "python:             $py $($pyArgs -join ' ')"
            Write-Host "python version:     $(& $py @pyArgs --version 2>&1)"
            Write-Host "python path:        $(& $py @pyArgs -c 'import sys; print(sys.executable)' 2>&1)"
            Write-Host "requests:           $(& $py @pyArgs -c 'import requests; print(requests.__version__)' 2>&1)"
            Write-Host "curl_cffi:          $(& $py @pyArgs -c 'import curl_cffi; print(curl_cffi.__version__)' 2>&1)"
          } else {
            Write-Host "python:             NOT FOUND (set DEOVR_CI_PYTHON to a full path)"
          }

          # Runner version comes from file properties, not from executing the
          # exe: starting Runner.Listener.exe for a version string is unsafe.
          try {
            $runnerRoot = Split-Path (Split-Path $env:RUNNER_WORKSPACE)
            Write-Host "runner root:        $runnerRoot"
            $listener = Join-Path $runnerRoot "bin\Runner.Listener.exe"
            if (Test-Path $listener) {
              Write-Host "runner version:     $((Get-Item $listener).VersionInfo.FileVersion)"
            }
            $externals = Join-Path $runnerRoot "externals"
            if (Test-Path $externals) {
              Write-Host "runner node:        $((Get-ChildItem -Directory $externals | Select-Object -ExpandProperty Name) -join ', ')"
            }
          } catch {
            Write-Host "runner root:        NOT DETECTED ($($_.Exception.Message))"
          }

      - name: Fetch task code
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          if (-not $env:GH_TOKEN) {
            Write-Host "##[error] GH_TOKEN is empty: without it the private repository cannot be cloned."
            throw "GH_TOKEN is empty"
          }

          # Credentials go through the git config in environment variables: the
          # token never reaches the command line, the URL or an on-disk config.
          $pair = "x-access-token:$env:GH_TOKEN"
          $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
          $env:GIT_CONFIG_COUNT = "2"
          $env:GIT_CONFIG_KEY_0 = "http.https://github.com/.extraheader"
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $b64"
          $env:GIT_CONFIG_KEY_1 = "safe.directory"
          $env:GIT_CONFIG_VALUE_1 = "*"

          $src = "$env:RUNNER_TEMP\agent-src"
          if (Test-Path $src) { Remove-Item -Recurse -Force $src }

          $url = "https://github.com/$env:GITHUB_REPOSITORY.git"
          Write-Host "Cloning $env:GITHUB_REPOSITORY, branch $env:GITHUB_REF_NAME"
          & git clone --quiet --depth 1 --branch $env:GITHUB_REF_NAME $url $src

          if ($LASTEXITCODE -ne 0) {
            Write-Host "##[error] git clone failed with exit code $LASTEXITCODE. Check that the job token can read this repository."
            throw "git clone failed"
          }

          Push-Location $src
          try {
            Write-Host "Checked out: $(& git rev-parse HEAD)"
            Write-Host "Expected:    $env:GITHUB_SHA"
          } finally { Pop-Location }

      - name: Run net_probe
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $env:PYTHONIOENCODING = "utf-8"

          $src = "$env:RUNNER_TEMP\agent-src"
          $out = "$env:RUNNER_TEMP\net_probe_data"
          New-Item -ItemType Directory -Force $out | Out-Null

          $py = $null
          $pyArgs = @()
          if (Get-Command python -ErrorAction SilentlyContinue) { $py = "python" }
          elseif (Get-Command py -ErrorAction SilentlyContinue) { $py = "py"; $pyArgs = @("-3") }
          elseif ($env:DEOVR_CI_PYTHON) { $py = $env:DEOVR_CI_PYTHON }

          if (-not $py) {
            Write-Host "##[error] Python not found by the runner. Find the interpreter the application uses (for example .venv\Scripts\python.exe inside the project), set the machine environment variable DEOVR_CI_PYTHON to its full path and restart the runner."
            throw "Python not found"
          }

          # 'requests' is checked separately so that the reason shows up as an
          # annotation instead of drowning in an import traceback.
          & $py @pyArgs -c "import requests" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "##[error] The interpreter '$py' has no 'requests' package. Install it: `"$py`" -m pip install requests"
            throw "requests is missing"
          }

          & $py @pyArgs "$src\scripts\ci\net_probe.py" `
              --targets "$src\scripts\ci\targets.json" `
              --out-dir $out

          if ($LASTEXITCODE -ne 0) {
            Write-Host "##[error] net_probe exited with code $LASTEXITCODE. The next step still publishes whatever report exists."
            throw "net_probe failed"
          }

      - name: Publish report to ci-reports
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $env:PYTHONIOENCODING = "utf-8"

          $src = "$env:RUNNER_TEMP\agent-src"
          if (-not (Test-Path $src)) {
            Write-Host "##[error] No repository clone at $src : the 'Fetch task code' step did not finish, so there is nothing to publish from. See that step in the log."
            throw "no clone"
          }

          $pair = "x-access-token:$env:GH_TOKEN"
          $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
          $env:GIT_CONFIG_COUNT = "2"
          $env:GIT_CONFIG_KEY_0 = "http.https://github.com/.extraheader"
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $b64"
          $env:GIT_CONFIG_KEY_1 = "safe.directory"
          $env:GIT_CONFIG_VALUE_1 = "*"

          $py = $null
          $pyArgs = @()
          if (Get-Command python -ErrorAction SilentlyContinue) { $py = "python" }
          elseif (Get-Command py -ErrorAction SilentlyContinue) { $py = "py"; $pyArgs = @("-3") }
          elseif ($env:DEOVR_CI_PYTHON) { $py = $env:DEOVR_CI_PYTHON }

          if (-not $py) {
            Write-Host "##[error] Python not found by the runner, so the report cannot be published. Set DEOVR_CI_PYTHON to the full path of the interpreter the application uses and restart the runner."
            throw "Python not found"
          }

          # Publishing lives in a python script: it is covered by a local run on
          # a real git repository (see scripts/ci/publish_report.py).
          # --error is deliberately English: Cyrillic passed from a run block
          # would land in the report garbled (see the encoding note at the top).
          & $py @pyArgs "$src\scripts\ci\publish_report.py" `
              --repo-dir $src `
              --data-dir "$env:RUNNER_TEMP\net_probe_data" `
              --template-dir "$src\scripts\ci\reports-branch" `
              --task "net_probe" `
              --error "The task did not leave a report - see the 'Run net_probe' step output in the run log." `
              --message "net_probe: $env:GITHUB_REF_NAME @ $env:GITHUB_SHA (run $env:GITHUB_RUN_ID)"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "##[error] publish_report exited with code $LASTEXITCODE : the report was not committed to ci-reports."
            throw "publish_report failed"
          }
