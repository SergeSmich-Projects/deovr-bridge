name: Windows self-hosted runner smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-runner-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    name: Safe Windows runner check
    runs-on:
      - self-hosted
      - Windows
      - X64
      - deovr-bridge

    timeout-minutes: 5

    steps:
      - name: Check runner environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:RUNNER_OS -ne "Windows") {
            throw "Expected Windows, got $env:RUNNER_OS"
          }

          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner architecture: $env:RUNNER_ARCH"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Temporary directory: $env:RUNNER_TEMP"

          git --version

          if (Get-Command python -ErrorAction SilentlyContinue) {
            python --version
          }
          else {
            Write-Host "Python was not found. This does not fail the smoke test."
          }

      - name: Test temporary directory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $probe = Join-Path $env:RUNNER_TEMP "deovr-bridge-smoke.txt"

          try {
            "safe runner smoke test" |
              Set-Content -Path $probe -Encoding UTF8

            if ((Get-Content -Path $probe -Raw).Trim() -ne "safe runner smoke test") {
              throw "Temporary file verification failed"
            }

            Write-Host "Temporary write check passed."
          }
          finally {
            Remove-Item -Path $probe -Force -ErrorAction SilentlyContinue
          }
