name: Windows runner smoke test

on:
  workflow_dispatch: {}
  push:
    branches:
      - arena/01a10c5e-deovr-bridge
    paths:
      - .github/workflows/windows-runner-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    name: Safe Windows runner check
    runs-on:
      - self-hosted
      - Windows
      - X64
      - deovr-bridge
    timeout-minutes: 5

    steps:
      - name: Verify isolated runner environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_OS -ne "Windows") {
            throw "Expected Windows runner, got '$env:RUNNER_OS'"
          }
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner architecture: $env:RUNNER_ARCH"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Temporary directory: $env:RUNNER_TEMP"
          git --version
          if (Get-Command python -ErrorAction SilentlyContinue) {
            python --version
          } else {
            Write-Host "Python was not found; this is informational for the smoke test."
          }

      - name: Verify temporary write access
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $probe = Join-Path $env:RUNNER_TEMP "deovr-bridge-smoke.txt"
          try {
            "safe runner smoke test" | Set-Content -Path $probe -Encoding UTF8
            if ((Get-Content -Path $probe -Raw).Trim() -ne "safe runner smoke test") {
              throw "Temporary file verification failed"
            }
            Write-Host "Temporary write check passed."
          }
          finally {
            Remove-Item -Path $probe -Force -ErrorAction SilentlyContinue
          }
